[package]
name = "bevy_v4l2"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
description = "Low-latency V4L2 webcam capture for Bevy: DMA-BUF zero-copy import into wgpu, GPU YUV conversion, MJPEG fallback, camera controls"
repository = "https://github.com/rvdende/bevy_v4l2"
documentation = "https://docs.rs/bevy_v4l2"
readme = "README.md"
keywords = ["bevy", "v4l2", "webcam", "dmabuf", "vulkan"]
categories = ["game-development", "multimedia::video", "hardware-support", "os::linux-apis"]
exclude = [".github/", "*.png"]

[features]
default = ["dmabuf", "mjpeg"]
## Zero-copy DMA-BUF import into wgpu's Vulkan backend. Requires `bevy/raw_vulkan_init`, which
## this feature enables.
dmabuf = ["dep:ash", "bevy/raw_vulkan_init"]
## Decode MJPEG streams on a CPU thread when only a compressed mode reaches the wanted rate.
mjpeg = ["dep:zune-jpeg"]

[dependencies]
bevy = { version = "0.19", default-features = false, features = ["bevy_asset", "bevy_render", "bevy_pbr", "bevy_image", "bevy_mesh", "bevy_shader", "bevy_log", "std"] }
wgpu = "29"
ash = { version = "0.38", optional = true }
zune-jpeg = { version = "0.5", optional = true }
v4l = "0.14"
libc = "0.2"
thiserror = "2"
tracing = "0.1"
crossbeam-channel = "0.5"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[dev-dependencies]
# Examples need a window and an event loop, which the library itself does not.
bevy = { version = "0.19", features = ["wayland", "x11"] }

# Examples and tests: an unoptimised JPEG decoder takes >100 ms per 720p frame.
[profile.dev.package."*"]
opt-level = 3
